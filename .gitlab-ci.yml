stages:
  - verify
  - native
  - qualify
  - performance

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        MAIN_CACHE_POLICY: pull-push
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

variables:
  # CIFIX2 (c2, port of cloud's checkout fix): .vscode-test holds node-pty paths > 260 chars; without
  # core.longpaths git clean fails at checkout ("failed to remove .vscode-test/...", "Filename too long").
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "core.longpaths"
  GIT_CONFIG_VALUE_0: "true"
  # .vscode-test and .ci-tools (pinned Node) stay on the build dir across jobs: deleting them at checkout
  # raced with locked files. scripts/ci-windows.ps1 verifies Node by SHA-256 before reuse.
  GIT_CLEAN_FLAGS: "-ffdx -e .vscode-test/ -e .ci-tools/"
  # CIFIX2: only verify_and_package on main pushes the shared cache; every other job pulls.
  MAIN_CACHE_POLICY: pull
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/ms-playwright"

default:
  tags: [local-windows]
  before_script:
    - . ./scripts/ci-windows.ps1 -Node
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
      prefix: datapass-vscode
    paths:
      - .cache/npm/
      - .cache/pip/
    policy: pull

verify_and_package:
  stage: verify
  # CIBOOT1: ~8 min once the Node bootstrap is fixed (scripts/ci-windows.ps1); 25m makes a hang fail
  # clearly before the job token expires (~50 min).
  timeout: 25m
  # CIFIX2: the one writer of the shared cache, on main only (workflow rule sets MAIN_CACHE_POLICY).
  cache:
    key:
      files:
        - package-lock.json
      prefix: datapass-vscode
    paths:
      - .cache/npm/
      - .cache/pip/
    policy: $MAIN_CACHE_POLICY
  script:
    - Invoke-CiNative npm.cmd ci --prefer-offline
    - Invoke-CiNative npm.cmd run verify
    - Invoke-CiNative npx.cmd vsce package --no-dependencies
    - |
      $packages = @(Get-ChildItem -LiteralPath . -Filter *.vsix -File)
      if ($packages.Count -ne 1) { throw 'Expected exactly one packaged VSIX' }
      ./scripts/check-vsix.ps1 -Path $packages[0].FullName
  artifacts:
    name: "datapass-vscode-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths:
      - "*.vsix"
      - "*.vsix.sha256"

demo_fixture_tests:
  stage: verify
  before_script:
    - . ./scripts/ci-windows.ps1 -Python
  timeout: 10m
  script:
    - Invoke-CiNative $CiPython -m pip install --disable-pip-version-check pytest
    - Invoke-CiNative $CiPython -m pytest -q -p no:cacheprovider examples/v3/etl-demo
  variables:
    PYTHONDONTWRITEBYTECODE: "1"

# Qualify the newly aligned contained parser without competing desktop launches.
# This fixture runs here exactly once; legacy desktop shards exclude it below.
native_parser_qualification:
  stage: native
  timeout: 20m
  allow_failure: false
  variables:
    DATAPASS_TEST_VSCODE_VERSION: "1.139.1"
  rules: &desktop_rules
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        # Product inputs only; documentation-only MRs keep the existing lighter gates.
        paths: &desktop_inputs
          - src/**/*
          - vendor/**/*
          - contracts/**/*
          - schemas/**/*
          - resources/**/*
          - examples/**/*
          - tests/**/*
          - qa/**/*
          - scripts/**/*
          - package.json
          - package-lock.json
          - tsconfig.json
          - esbuild.mjs
          - .vscodeignore
          - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
    - when: never
  before_script:
    - . ./scripts/ci-windows.ps1 -Node
    - Invoke-CiNative npm.cmd ci --prefer-offline
  script:
    - |
      $vsix = Get-ChildItem -LiteralPath . -Filter *.vsix -File | Select-Object -First 1
      if (-not $vsix) { throw 'Packaged VSIX artifact missing' }
      Invoke-CiNative npx.cmd tsx scripts/desktop-test.ts "--vsix=$($vsix.FullName)" --fixture=v6-intelligence
  artifacts:
    name: "datapass-native-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths:
      - out/integration/

desktop_acceptance:
  stage: qualify
  variables:
    # Exact release exercised by the passing Windows desktop baseline (Q1).
    DATAPASS_TEST_VSCODE_VERSION: "1.139.1"
  # Q1: all 20 fixtures passed on runner 56844575; failures now block acceptance.
  allow_failure: false
  # DESKSHARD1: fixtures split over 4 jobs balanced by measured time (scripts/desktop-test.ts,
  # FIXTURE_SECONDS); together they run every fixture once, and every shard gates.
  parallel: 4
  timeout: 45m
  # DESKHARD1: one retry for a shard that fails under runner load (unresponsive extension host);
  # a real regression fails twice and still blocks.
  retry:
    max: 1
    when: [runner_system_failure, script_failure]
  cache:
    - key:
        files:
          - package-lock.json
        prefix: datapass-vscode
      paths:
        - .cache/npm/
        - .cache/pip/
      policy: pull
  rules: *desktop_rules
  before_script:
    - . ./scripts/ci-windows.ps1 -Node
    - Invoke-CiNative npm.cmd ci --prefer-offline
  script:
    - |
      $vsix = Get-ChildItem -LiteralPath . -Filter *.vsix -File | Select-Object -First 1
      if (-not $vsix) { throw 'Packaged VSIX artifact missing' }
      Invoke-CiNative npx.cmd tsx scripts/desktop-test.ts "--vsix=$($vsix.FullName)" --exclude-fixture=v6-intelligence
  artifacts:
    name: "datapass-desktop-$CI_COMMIT_SHORT_SHA-$CI_NODE_INDEX"
    when: always
    expire_in: 14 days
    paths:
      - out/integration/

ui_smoke:
  stage: qualify
  variables:
    DATAPASS_TEST_VSCODE_VERSION: "1.139.1"
  # DESKSHARD1: two journeys of ~1 min on a passing run; 20m makes a hang fail clearly before the
  # job token expires (~50 min) instead of timing out unexplained.
  timeout: 45m
  cache:
    - key:
        files:
          - package-lock.json
        prefix: datapass-vscode
      paths:
        - .cache/npm/
        - .cache/pip/
      policy: pull
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        paths: *desktop_inputs
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - when: never
  needs:
    - job: verify_and_package
      artifacts: true
    - job: native_parser_qualification
      artifacts: false
  before_script:
    - . ./scripts/ci-windows.ps1 -Node
    - Invoke-CiNative npm.cmd ci --prefer-offline
  script:
    - |
      $vsix = Get-ChildItem -LiteralPath . -Filter *.vsix -File | Select-Object -First 1
      if (-not $vsix) { throw 'Packaged VSIX artifact missing' }
      $env:DATAPASS_QA_VSIX = $vsix.FullName
      Invoke-CiNative npx.cmd tsx --test --test-concurrency=1 tests/qaPrepare.test.ts tests/qaAuto.test.ts tests/qa-ui.smoke.test.ts tests/qa-v6.smoke.test.ts
  artifacts:
    name: "datapass-ui-smoke-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths:
      - out/qa-v6/
      - out/qa-ui/
      - out/qa-ui-hop/

# Run after the desktop shards/UI have finished: they share this Windows host and their
# process launches otherwise distort the extension-host performance measurements.
performance_budget:
  stage: performance
  variables:
    DATAPASS_TEST_VSCODE_VERSION: "1.139.1"
  timeout: 20m
  allow_failure: false
  dependencies: [verify_and_package]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        paths: *desktop_inputs
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never
  before_script:
    - . ./scripts/ci-windows.ps1 -Node
    - Invoke-CiNative npm.cmd ci --prefer-offline
  script:
    - |
      $vsix = Get-ChildItem -LiteralPath . -Filter *.vsix -File | Select-Object -First 1
      if (-not $vsix) { throw 'Packaged VSIX artifact missing' }
      Invoke-CiNative npx.cmd tsx scripts/perf.ts --ci --runs=3 "--vsix=$($vsix.FullName)"
  artifacts:
    name: "datapass-performance-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths:
      - out/perf/


# PINDRIFT1: report drift between vendor/common/manifest.json (version + digest pins) and Common main, with
# Common's tools/pin-drift (ok | behind | digest-mismatch | unknown). Informational: allow_failure, never a
# required check in V5. --strict turns drift into a visible warning; the JSON report is kept as an artifact.
common_pin_drift:
  stage: verify
  timeout: 10m
  allow_failure: true
  cache: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - . ./scripts/ci-windows.ps1 -Node
  script:
    - |
      $common = Join-Path $env:TEMP "datapass-pin-drift-$env:CI_JOB_ID"
      try {
        # Common is not anonymous: clone with the job token (this project must be on Common's job-token allowlist); never prompt.
        $env:GIT_TERMINAL_PROMPT = '0'
        Invoke-CiNative git -c credential.helper= clone --quiet --single-branch --no-checkout "https://gitlab-ci-token:$($env:CI_JOB_TOKEN)@gitlab.com/juliandatapass-group/datapass-vscode-common.git" $common
        Invoke-CiNative git -C $common checkout --quiet HEAD -- tools/pin-drift
        # The tool imports @juliandatapass-group/project-contracts/pin-drift; the clone has no node_modules and this job runs no npm ci,
        # so unpack this repo's vendored (pinned) contracts tarball next to the tool for Node to resolve it.
        $spec = (Get-Content -Raw package.json | ConvertFrom-Json).dependencies.'@juliandatapass-group/project-contracts'
        if ($spec -notlike 'file:*') { throw "project-contracts is not vendored: $spec" }
        $pkg = Join-Path $common 'node_modules\@juliandatapass-group\project-contracts'
        New-Item -ItemType Directory -Force -Path $pkg | Out-Null
        Invoke-CiNative (Join-Path $env:SystemRoot 'System32\tar.exe') -xzf $spec.Substring(5) -C $pkg --strip-components=1
        Invoke-CiNative node "$common/tools/pin-drift/cli.mjs" --manifest vendor/common/manifest.json --common $common --ref origin/main --json pin-drift.json --strict
      } finally {
        Remove-Item -LiteralPath $common -Recurse -Force -ErrorAction SilentlyContinue
      }
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - pin-drift.json
