name: extension-ci

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "claude/**"

jobs:
  validate:
    # Windows is the primary desktop target; several path/shell bugs only reproduce there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
      # V3-DEMO: the demo client's own pytest suites (no Spark or Airflow needed).
      - uses: actions/setup-python@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pytest && python -m pytest -q -p no:cacheprovider examples/v3/etl-demo
        if: matrix.os == 'ubuntu-latest'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - run: npm run build
      - run: npx vsce package --no-dependencies
        if: matrix.os == 'ubuntu-latest'
      # QA-1: qa:prepare installs the VSIX just packaged into an isolated profile on a local fixture.
      - run: DATAPASS_QA_VSIX="$(ls "$PWD"/*.vsix | head -n 1)" npx tsx --test tests/qaPrepare.test.ts
        if: matrix.os == 'ubuntu-latest'
      # QA-4: qa:ui drives that isolated VS Code through Playwright _electron (smoke journey on doc-pipeline).
      - run: DATAPASS_QA_VSIX="$(ls "$PWD"/*.vsix | head -n 1)" xvfb-run -a npx tsx --test tests/qa-ui.smoke.test.ts
        if: matrix.os == 'ubuntu-latest'
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: qa-ui-evidence
          path: out/qa-ui/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: datapass-vscode-vsix
          path: "*.vsix"
          if-no-files-found: error

  desktop:
    # Real VS Code (downloaded stable build) with an isolated profile and no other extensions.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: xvfb-run -a npm run test:desktop
        if: runner.os == 'Linux'
      - run: npm run test:desktop
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence-${{ matrix.os }}
          path: out/integration/*.json
          if-no-files-found: warn

  perf:
    # V1-PERF / V1-REF: activation, first paint, full refresh and refreshes after `git fetch` on a
    # FOIL-sized fixture (scripts/perf.ts); fails when a median is above twice its budget.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: xvfb-run -a npm run perf -- --ci
        if: runner.os == 'Linux'
      - run: npm run perf -- --ci
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-${{ matrix.os }}
          path: out/perf/*.json
          if-no-files-found: warn
