name: extension-ci

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "claude/**"

jobs:
  validate:
    # Windows is the primary desktop target; several path/shell bugs only reproduce there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx vsce package --no-dependencies
        if: matrix.os == 'ubuntu-latest'
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: datapass-vscode-vsix
          path: "*.vsix"
          if-no-files-found: error

  desktop:
    # Real VS Code (downloaded stable build) with an isolated profile and no other extensions.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: xvfb-run -a npm run test:desktop
        if: runner.os == 'Linux'
      - run: npm run test:desktop
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence-${{ matrix.os }}
          path: out/integration/*.json
          if-no-files-found: warn
