name: extension-ci

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: datapass-vscode-vsix
          path: "*.vsix"
          if-no-files-found: error
